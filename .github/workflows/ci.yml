name: CI

# Unit tests, generated-file checks, package build and smoke tests for
# framework v1 and v2. Runs on pushes to main and develop and on pull
# requests.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core

      - name: Install Python packages
        run: python -m pip install jinja2 weasyprint openpyxl jsonschema

      - name: Unit and golden tests
        run: make test

      - name: Docs, generated files and packages
        run: make validate-docs

      - name: Smoke tests (v1 and v2)
        run: |
          make smoke
          make smoke-cross

      - name: Demo PDFs from the v2 mock
        run: make demo
