name: Deploy site to GitHub Pages

# Publishes the docs/ folder to GitHub Pages on every push to main
# and on manual runs. Configure once in repo: Settings → Pages → Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check generated files are current
        run: |
          python3 scripts/generate_v2_collection.py --check
          python3 scripts/generate_v2_reference.py --check
          python3 scripts/generate_v2_tools_html.py --check
          python3 scripts/sync_spec_translations.py --check

      - name: Build public ZIP downloads
        run: python3 scripts/build_language_kits.py --out docs/downloads --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
