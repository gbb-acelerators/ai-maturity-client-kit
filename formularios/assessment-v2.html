ge metrics API or dashboard) are reviewed monthly by engineering leadership.", "pt-br": "Métricas de uso (por exemplo a API ou dashboard de métricas de uso do Copilot) são revisadas mensalmente pela liderança de engenharia.", "es": "Las métricas de uso (por ejemplo la API o dashboard de métricas de uso de Copilot) se revisan mensualmente por el liderazgo de ingeniería."}, "l4": {"en": "Cohort movement is a managed target; enablement actions are evaluated by their effect on cohorts.", "pt-br": "Movimento de coortes é uma meta gerenciada; ações de capacitação são avaliadas por seu efeito nas coortes.", "es": "El movimiento de cohortes es un objetivo gestionado; las acciones de habilitación se evalúan por su efecto en las cohortes."}}}, {"id": "D9-Q2", "text": {"en": "Are software delivery metrics (lead time, deployment frequency, change failure rate, time to restore) tracked and compared before and after AI adoption?", "pt-br": "Métricas de entrega de software (lead time, deployment frequency, change failure rate, time to restore) são rastreadas e comparadas antes e depois da adoção de IA?", "es": "¿Las métricas de entrega de software (lead time, deployment frequency, change failure rate, time to restore) se rastrean y comparan antes y después de la adopción de IA?"}, "anchors": {"l3": {"en": "DORA metrics are collected automatically for most services and reviewed with AI adoption data.", "pt-br": "Métricas DORA são coletadas automaticamente para a maioria dos serviços e revisadas com dados de adoção de IA.", "es": "Las métricas DORA se recopilan automáticamente para la mayoría de los servicios y se revisan con datos de adopción de IA."}, "l4": {"en": "Delivery metrics are part of AI investment decisions; regressions trigger corrective action.", "pt-br": "Métricas de entrega fazem parte das decisões de investimento em IA; regressões disparam ação corretiva.", "es": "Las métricas de entrega son parte de decisiones de inversión en IA; las regresiones disparan acción correctiva."}}}, {"id": "D9-Q3", "text": {"en": "Are PR throughput, time to merge and the share and merge rate of AI- or agent-authored PRs tracked?", "pt-br": "Throughput de PR, tempo até merge e a parcela e taxa de merge de PRs criados por IA ou agentes são rastreados?", "es": "¿Se rastrean el throughput de PR, el tiempo hasta merge y la proporción y tasa de merge de PRs creados por IA o agentes?"}, "anchors": {"l3": {"en": "PR lifecycle metrics are reported per organization; agent-authored PRs are identified separately, including their post-merge fix rate.", "pt-br": "Métricas de ciclo de vida de PR são reportadas por organização; PRs criados por agentes são identificados separadamente, incluindo sua taxa de correções pós-merge.", "es": "Las métricas de ciclo de vida de PR se reportan por organización; los PRs creados por agentes se identifican por separado, incluida su tasa de correcciones post-merge."}, "l4": {"en": "Flow metrics are tied to quality metrics (D5) so that faster flow is not bought with instability.", "pt-br": "Métricas de fluxo são vinculadas a métricas de qualidade (D5) para que fluxo mais rápido não seja comprado com instabilidade.", "es": "Las métricas de flujo se vinculan con métricas de calidad (D5) para que el flujo más rápido no se compre con inestabilidad."}}}, {"id": "D9-Q4", "text": {"en": "Is developer experience measured regularly (perceived productivity, friction, trust in AI, satisfaction), using a recognized framework such as SPACE or the DORA outcome questions?", "pt-br": "Developer experience é medida regularmente (produtividade percebida, fricção, confiança em IA, satisfação), usando um framework reconhecido como SPACE ou as perguntas de resultado do DORA?", "es": "¿Developer experience se mide regularmente (productividad percibida, fricción, confianza en IA, satisfacción), usando un framework reconocido como SPACE o las preguntas de resultado de DORA?"}, "anchors": {"l3": {"en": "A survey runs at least twice a year with good participation; results are shared and acted on.", "pt-br": "Uma pesquisa ocorre pelo menos duas vezes por ano com boa participação; resultados são compartilhados e geram ações.", "es": "Una encuesta se realiza al menos dos veces al año con buena participación; los resultados se comparten y generan acciones."}, "l4": {"en": "Survey results are combined with telemetry (D9-Q1 to Q3) to find and remove friction.", "pt-br": "Resultados de pesquisa são combinados com telemetria (D9-Q1 a Q3) para encontrar e remover fricção.", "es": "Los resultados de encuestas se combinan con telemetría (D9-Q1 a Q3) para encontrar y eliminar fricción."}}}, {"id": "D9-Q5", "text": {"en": "Is AI impact estimated with controlled or cohort-based comparisons (for example pilot vs control, adoption cohorts, before/after with a baseline) rather than only self-reported estimates?", "pt-br": "O impacto de IA é estimado com comparações controladas ou baseadas em coortes (por exemplo piloto versus controle, coortes de adoção, antes/depois com um baseline) em vez de apenas estimativas autorreportadas?", "es": "¿El impacto de IA se estima con comparaciones controladas o basadas en cohortes (por ejemplo piloto versus control, cohortes de adopción, antes/después con un baseline) en vez de solo estimaciones autorreportadas?"}, "anchors": {"l3": {"en": "At least one controlled or cohort comparison has been run and documented, with its limitations.", "pt-br": "Pelo menos uma comparação controlada ou de coorte foi executada e documentada, com suas limitações.", "es": "Se ejecutó y documentó al menos una comparación controlada o de cohorte, con sus limitaciones."}, "l4": {"en": "Comparisons run continuously for major tools and practices; decisions cite them.", "pt-br": "Comparações são executadas continuamente para ferramentas e práticas principais; decisões as citam.", "es": "Las comparaciones se ejecutan continuamente para herramientas y prácticas principales; las decisiones las citan."}}}, {"id": "D9-Q6", "text": {"en": "Are AI costs (seats, premium requests, tokens, agent runs) budgeted, monitored per team and use case, with thresholds and regular reviews?", "pt-br": "Custos de IA (seats, premium requests, tokens, runs de agentes) são orçados, monitorados por equipe e caso de uso, com thresholds e revisões regulares?", "es": "¿Los costos de IA (seats, premium requests, tokens, runs de agentes) se presupuestan, monitorean por equipo y caso de uso, con thresholds y revisiones regulares?"}, "anchors": {"l3": {"en": "Budgets and alert thresholds exist per organization or team; high-consumption workflows are reviewed in retrospectives.", "pt-br": "Orçamentos e thresholds de alerta existem por organização ou equipe; workflows de alto consumo são revisados em retrospectivas.", "es": "Existen presupuestos y thresholds de alerta por organización o equipo; los workflows de alto consumo se revisan en retrospectivas."}, "l4": {"en": "Cost per outcome (for example per merged PR) is tracked; routing and context practices are tuned to reduce waste.", "pt-br": "Custo por resultado (por exemplo por PR mergeado) é rastreado; práticas de roteamento e contexto são ajustadas para reduzir desperdício.", "es": "Se rastrea el costo por resultado (por ejemplo por PR mergeado); las prácticas de enrutamiento y contexto se ajustan para reducir desperdicio."}}}, {"id": "D9-Q7", "text": {"en": "Are AI engineering outcomes connected to business value (business case, ROI assumptions, OKRs) and reviewed with finance or business stakeholders?", "pt-br": "Resultados de engenharia com IA são conectados a valor de negócio (business case, premissas de ROI, OKRs) e revisados com stakeholders de finanças ou negócio?", "es": "¿Los resultados de ingeniería con IA se conectan con valor de negocio (business case, supuestos de ROI, OKRs) y se revisan con stakeholders de finanzas o negocio?"}, "anchors": {"l3": {"en": "A business case with explicit assumptions exists and is reviewed at least yearly.", "pt-br": "Existe um business case com premissas explícitas e ele é revisado pelo menos anualmente.", "es": "Existe un business case con supuestos explícitos y se revisa al menos anualmente."}, "l4": {"en": "Value is reported on a fixed cadence with measured inputs from D9-Q1 to Q6; investment is adjusted from results.", "pt-br": "Valor é reportado em uma cadência fixa com insumos medidos de D9-Q1 a Q6; investimento é ajustado a partir dos resultados.", "es": "El valor se informa con una cadencia fija con insumos medidos de D9-Q1 a Q6; la inversión se ajusta a partir de los resultados."}}}]}]};
const UI = {"en": {"html_title": "AI-Assisted SDLC Maturity Assessment v2", "html_intro": "Offline form. Answers stay in this browser. Use Export to download a respostas.json for the kit (one respondent per file).", "privacy": "Privacy: this page sends nothing over the network. The exported file contains only what you type here.", "org": "Organization", "name": "Your name (optional)", "export_json": "Export respostas.json", "export_csv": "Export CSV", "progress": "answered", "section0": "Section 0: Respondent profile (not scored)", "l1_l2": "L1 to L2 look like", "l3": "L3 looks like", "l4": "L4 looks like", "placeholder": "Tool, % coverage, metric, time window, link", "summary": "Your self-score (one respondent, indicative)", "summary_note": "Same rules as the engine: NA and blank excluded, dimension = mean of its questions, overall = mean of dimensions. The official result comes from scripts/assessment_engine.py over all respondents.", "overall": "Overall"}, "pt-br": {"html_title": "AI-Assisted SDLC Maturity Assessment v2", "html_intro": "Formulário offline. As respostas ficam neste navegador. Use Exportar para baixar um respostas.json para o kit (um respondente por arquivo).", "privacy": "Privacidade: esta página não envia nada pela rede. O arquivo exportado contém apenas o que você digitar aqui.", "org": "Organização", "name": "Seu nome (opcional)", "export_json": "Exportar respostas.json", "export_csv": "Exportar CSV", "progress": "respondidas", "section0": "Seção 0: Perfil do respondente (não pontua)", "l1_l2": "L1 a L2 se parecem com", "l3": "L3 se parece com", "l4": "L4 se parece com", "placeholder": "Ferramenta, % de cobertura, métrica, período, link", "summary": "Sua autoavaliação (um respondente, indicativa)", "summary_note": "Mesmas regras do engine: NA e em branco excluídos, dimensão = média das perguntas, geral = média das dimensões. O resultado oficial vem de scripts/assessment_engine.py sobre todos os respondentes.", "overall": "Geral"}, "es": {"html_title": "AI-Assisted SDLC Maturity Assessment v2", "html_intro": "Formulario offline. Las respuestas quedan en este navegador. Use Exportar para descargar un respostas.json para el kit (una persona por archivo).", "privacy": "Privacidad: esta página no envía nada por la red. El archivo exportado contiene solo lo que usted escriba aquí.", "org": "Organización", "name": "Su nombre (opcional)", "export_json": "Exportar respostas.json", "export_csv": "Exportar CSV", "progress": "respondidas", "section0": "Sección 0: Perfil de la persona que responde (no puntúa)", "l1_l2": "L1 a L2 se ven así", "l3": "L3 se ve así", "l4": "L4 se ve así", "placeholder": "Herramienta, % de cobertura, métrica, período, enlace", "summary": "Su autoevaluación (una persona, indicativa)", "summary_note": "Mismas reglas que el engine: NA y en blanco excluidos, dimensión = media de sus preguntas, general = media de las dimensiones. El resultado oficial viene de scripts/assessment_engine.py sobre todas las personas.", "overall": "General"}};
const KEY = "ai-maturity-v2-" + FW.version;
let state = JSON.parse(localStorage.getItem(KEY) || '{"answers":{},'
  + '"profile":{}}');
let lang = localStorage.getItem(KEY + "-lang") || "en";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;",
  "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c]));
function save() { localStorage.setItem(KEY, JSON.stringify(state));
  progress(); }
function progress() {
  const total = FW.dimensions.reduce((n, d) => n + d.questions.length, 0);
  const done = Object.values(state.answers).filter((a) => a.level !==
    undefined).length;
  $("progress").textContent = done + " / " + total + " " + UI[lang].progress;
  summary();
}
function band(v) {
  if (v === null) return "-";
  const b = FW.level_bands.find((x, i) => v < x.max ||
    i === FW.level_bands.length - 1);
  return b.level + " " + FW.level_names[lang][b.level];
}
function summary() {
  const t = UI[lang];
  const mean = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length
    : null;
  const dims = FW.dimensions.map((d) => ({id: d.id, name: d.name[lang],
    score: mean(d.questions.map((q) => (state.answers[q.id] || {}).level)
      .filter((v) => typeof v === "number"))}));
  const overall = mean(dims.map((d) => d.score).filter((v) => v !== null));
  const fmt = (v) => v === null ? "-" : v.toFixed(2);
  let h = '<h2>' + esc(t.summary) + '</h2><table><tr><th>ID</th><th></th>'
    + '<th>Score</th><th></th></tr>';
  for (const d of dims) h += '<tr><td>' + d.id + '</td><td>' + esc(d.name)
    + '</td><td>' + fmt(d.score) + '</td><td>' + esc(band(d.score))
    + '</td></tr>';
  h += '<tr><th></th><th>' + esc(t.overall) + '</th><th>' + fmt(overall)
    + '</th><th>' + esc(band(overall)) + '</th></tr></table><p class="note">'
    + esc(t.summary_note) + '</p>';
  $("summary").innerHTML = h;
}
function render() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  $("title").textContent = t.html_title; $("intro").textContent =
    t.html_intro; $("privacy").textContent = t.privacy;
  $("orgLabel").textContent = t.org; $("nameLabel").textContent = t.name;
  $("json").textContent = t.export_json; $("csv").textContent =
    t.export_csv;
  $("org").value = state.org || ""; $("name").value = state.name || "";
  let h = '<section><h2>' + esc(t.section0) + '</h2>';
  for (const p of FW.profile_questions) {
    h += '<div class="q"><div><span class="qid">' + p.id + '</span> '
      + esc(p.text[lang]) + '</div><div class="opts">';
    p.options[lang].forEach((o, i) => {
      const canon = p.options.en[i];
      const cur = state.profile[p.id];
      const on = p.multi ? (cur || []).includes(canon) : cur === canon;
      h += '<label><input type="' + (p.multi ? "checkbox" : "radio")
        + '" name="' + p.id + '" data-p="' + p.id + '" value="'
        + esc(canon) + '"' + (on ? " checked" : "") + '> ' + esc(o)
        + '</label>';
    });
    h += '</div></div>';
  }
  h += '</section>';
  for (const d of FW.dimensions) {
    h += '<section><h2>' + d.id + ' · ' + esc(d.name[lang]) + '</h2>'
      + '<p class="why">' + esc(d.why_it_matters[lang]) + '</p>';
    for (const q of d.questions) {
      const a = state.answers[q.id] || {};
      h += '<div class="q"><div><span class="qid">' + q.id + '</span> '
        + esc(q.text[lang]) + '</div>';
      if (q.anchors.l1_l2) h += '<div class="anc"><b>' + esc(t.l1_l2)
        + ':</b> ' + esc(q.anchors.l1_l2[lang]) + '</div>';
      h += '<div class="anc"><b>' + esc(t.l3) + ':</b> '
        + esc(q.anchors.l3[lang]) + '</div><div class="anc"><b>'
        + esc(t.l4) + ':</b> ' + esc(q.anchors.l4[lang]) + '</div>'
        + '<div class="opts">';
      FW.options[lang].forEach((o, i) => {
        const val = i === 5 ? "na" : String(i);
        const on = a.level === undefined ? false :
          (a.level === null ? val === "na" : String(a.level) === val);
        h += '<label><input type="radio" name="' + q.id + '" data-q="'
          + q.id + '" value="' + val + '"' + (on ? " checked" : "")
          + '> ' + esc(o) + '</label>';
      });
      h += '</div><textarea data-e="' + q.id + '" placeholder="'
        + esc(t.placeholder) + '">' + esc(a.evidence || "")
        + '</textarea></div>';
    }
    h += '</section>';
  }
  $("form").innerHTML = h; progress();
}
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.q) {
    const a = state.answers[el.dataset.q] || {evidence: ""};
    a.level = el.value === "na" ? null : Number(el.value);
    state.answers[el.dataset.q] = a;
  } else if (el.dataset.p) {
    const p = FW.profile_questions.find((x) => x.id === el.dataset.p);
    if (p.multi) {
      const cur = new Set(state.profile[p.id] || []);
      el.checked ? cur.add(el.value) : cur.delete(el.value);
      state.profile[p.id] = [...cur];
    } else { state.profile[p.id] = el.value; }
  } else if (el.id === "lang") {
    lang = el.value; localStorage.setItem(KEY + "-lang", lang); render();
    return;
  }
  save();
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.e) {
    const a = state.answers[el.dataset.e] || {};
    a.evidence = el.value; state.answers[el.dataset.e] = a;
  } else if (el.id === "org") { state.org = el.value; }
  else if (el.id === "name") { state.name = el.value; }
  save();
});
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a"); a.href = url; a.download = name;
  a.click(); URL.revokeObjectURL(url);
}
$("json").onclick = () => {
  const answers = {};
  for (const [k, v] of Object.entries(state.answers)) {
    if (v.level !== undefined) answers[k] = {level: v.level,
      evidence: v.evidence || ""};
  }
  const out = {metadata: {organization: state.org || null,
    assessment_date: new Date().toISOString().slice(0, 10),
    language: lang === "pt-br" ? "pt-BR" : lang, source: "offline-html",
    framework_version: FW.version}, target_overrides: {},
    dimension_weights: {}, respondents: [{id: "R01",
    name: state.name || "Respondent 01", email: "", profile: state.profile,
    answers}]};
  download("respostas.json", JSON.stringify(out, null, 2),
    "application/json");
};
$("csv").onclick = () => {
  const rows = [["id", "level", "evidence"]];
  for (const d of FW.dimensions) for (const q of d.questions) {
    const a = state.answers[q.id] || {};
    rows.push([q.id, a.level === undefined ? "" : (a.level === null ?
      "NA" : "L" + a.level), a.evidence || ""]);
  }
  download("answers.csv", rows.map((r) => r.map((c) => '"' +
    String(c).replace(/"/g, '""') + '"').join(",")).join("\n"),
    "text/csv");
};
$("lang").value = lang;
render();
</script>
</body>
</html>
