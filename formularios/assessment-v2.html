ness OKRs; progress is reported to leadership on a fixed cadence.", "pt-br": "A estratégia é revisada a partir de resultados medidos (D9) e vinculada a OKRs de negócio; o progresso é reportado à liderança em uma cadência fixa.", "es": "La estrategia se revisa a partir de resultados medidos (D9) y se vincula a OKRs de negocio; el progreso se informa al liderazgo con una cadencia fija."}}}, {"id": "D1-Q2", "text": {"en": "Is it clear to engineers how they are and are not allowed to use AI at work, including which data can be shared with AI tools?", "pt-br": "Está claro para os engenheiros como eles podem e não podem usar IA no trabalho, incluindo quais dados podem ser compartilhados com ferramentas de IA?", "es": "¿Está claro para los ingenieros cómo pueden y no pueden usar IA en el trabajo, incluidos qué datos pueden compartirse con herramientas de IA?"}, "anchors": {"l3": {"en": "Written acceptable-use policy covers code, customer data, secrets and third-party IP; it is part of onboarding; exceptions have an owner.", "pt-br": "Política escrita de uso aceitável cobre code, dados de clientes, segredos e IP de terceiros; faz parte do onboarding; exceções têm um responsável.", "es": "La política escrita de uso aceptable cubre code, datos de clientes, secretos e IP de terceros; es parte del onboarding; las excepciones tienen un responsable."}, "l4": {"en": "Policy is enforced by technical controls (for example content exclusion, data loss prevention, allowlists) and audited; violations trigger automated alerts.", "pt-br": "A política é aplicada por controles técnicos (por exemplo content exclusion, prevenção contra perda de dados, allowlists) e auditada; violações disparam alertas automatizados.", "es": "La política se aplica mediante controles técnicos (por ejemplo content exclusion, prevención de pérdida de datos, allowlists) y se audita; las violaciones disparan alertas automatizadas."}}}, {"id": "D1-Q3", "text": {"en": "Is there a maintained catalog of approved AI tools, features and models for software development, managed through enterprise or organization policies?", "pt-br": "Existe um catálogo mantido de ferramentas, recursos e modelos de IA aprovados para desenvolvimento de software, gerenciado por políticas enterprise ou da organização?", "es": "¿Existe un catálogo mantenido de herramientas, funciones y modelos de IA aprobados para desarrollo de software, gestionado mediante políticas enterprise o de la organización?"}, "anchors": {"l3": {"en": "Enterprise/organization policies enable only approved features and models; the catalog lists owner, data handling and review date for each tool.", "pt-br": "Políticas enterprise/da organização habilitam apenas recursos e modelos aprovados; o catálogo lista responsável, tratamento de dados e data de revisão para cada ferramenta.", "es": "Las políticas enterprise/de la organización habilitan solo funciones y modelos aprobados; el catálogo lista responsable, manejo de datos y fecha de revisión para cada herramienta."}, "l4": {"en": "New models and tools go through a defined evaluation (quality, cost, security) before enablement; retired ones are removed on schedule.", "pt-br": "Novos modelos e ferramentas passam por uma avaliação definida (qualidade, custo, segurança) antes da habilitação; os descontinuados são removidos conforme cronograma.", "es": "Los nuevos modelos y herramientas pasan por una evaluación definida (calidad, costo, seguridad) antes de habilitarse; los retirados se eliminan según cronograma."}}}, {"id": "D1-Q4", "text": {"en": "Are data residency, retention, intellectual property and privacy requirements defined and applied to the AI tools and agents used in the SDLC?", "pt-br": "Requisitos de residência, retenção, propriedade intelectual e privacidade de dados estão definidos e aplicados às ferramentas e agentes de IA usados no SDLC?", "es": "¿Los requisitos de residencia, retención, propiedad intelectual y privacidad de datos están definidos y aplicados a las herramientas y agentes de IA usados en el SDLC?"}, "anchors": {"l3": {"en": "Requirements are documented per tool; sensitive repositories or files are excluded from AI context; logs and memory retention follow policy.", "pt-br": "Requisitos são documentados por ferramenta; repositórios ou arquivos sensíveis são excluídos do contexto de IA; retenção de logs e memória segue a política.", "es": "Los requisitos se documentan por herramienta; repositorios o archivos sensibles se excluyen del contexto de IA; la retención de logs y memoria sigue la política."}, "l4": {"en": "Compliance is assessed continuously (for example with a compliance manager) and mapped to regulations such as the EU AI Act where applicable.", "pt-br": "A conformidade é avaliada continuamente (por exemplo com um compliance manager) e mapeada a regulamentações como o EU AI Act quando aplicável.", "es": "El cumplimiento se evalúa continuamente (por ejemplo con un compliance manager) y se mapea a regulaciones como el EU AI Act cuando aplica."}}}, {"id": "D1-Q5", "text": {"en": "Has the organization defined which tasks are developer-led, developer-with-agent, or fully agent-led, and the controls required for each level?", "pt-br": "A organização definiu quais tarefas são lideradas pelo desenvolvedor, conduzidas por desenvolvedor com agente, ou totalmente lideradas por agente, e os controles exigidos para cada nível?", "es": "¿La organización definió qué tareas son lideradas por desarrollador, realizadas por desarrollador con agente, o totalmente lideradas por agente, y los controles requeridos para cada nivel?"}, "anchors": {"l3": {"en": "A published matrix maps task types (for example dependency upgrades, test generation, feature work, production changes) to autonomy levels and required approvals.", "pt-br": "Uma matriz publicada mapeia tipos de tarefa (por exemplo upgrades de dependências, geração de testes, trabalho de feature, mudanças em produção) para níveis de autonomia e aprovações exigidas.", "es": "Una matriz publicada mapea tipos de tarea (por ejemplo upgrades de dependencias, generación de pruebas, trabajo de feature, cambios en producción) a niveles de autonomía y aprobaciones requeridas."}, "l4": {"en": "The matrix is enforced by platform rules (for example branch protection, required reviewers per path) and updated from incident and quality data.", "pt-br": "A matriz é aplicada por regras da plataforma (por exemplo branch protection, revisores exigidos por caminho) e atualizada a partir de dados de incidentes e qualidade.", "es": "La matriz se aplica mediante reglas de plataforma (por ejemplo branch protection, revisores requeridos por ruta) y se actualiza a partir de datos de incidentes y calidad."}}}, {"id": "D1-Q6", "text": {"en": "Is AI use in software engineering governed by a responsible AI standard and a recognized risk framework (for example Microsoft Responsible AI Standard, NIST AI RMF, ISO/IEC 42001)?", "pt-br": "O uso de IA em engenharia de software é governado por um padrão de IA responsável e por um framework de risco reconhecido (por exemplo Microsoft Responsible AI Standard, NIST AI RMF, ISO/IEC 42001)?", "es": "¿El uso de IA en ingeniería de software está gobernado por un estándar de IA responsable y un framework de riesgo reconocido (por ejemplo Microsoft Responsible AI Standard, NIST AI RMF, ISO/IEC 42001)?"}, "anchors": {"l3": {"en": "A named framework is adopted; AI-related risks are in the risk register with owners and reviews.", "pt-br": "Um framework nomeado é adotado; riscos relacionados a IA estão no registro de riscos com responsáveis e revisões.", "es": "Se adopta un framework nombrado; los riesgos relacionados con IA están en el registro de riesgos con responsables y revisiones."}, "l4": {"en": "Framework controls are audited internally or externally; results feed back into policy and tooling.", "pt-br": "Controles do framework são auditados interna ou externamente; resultados retroalimentam política e tooling.", "es": "Los controles del framework se auditan interna o externamente; los resultados retroalimentan política y tooling."}}}, {"id": "D1-Q7", "text": {"en": "Is every AI agent used in the SDLC (coding agents, review agents, custom agents, pipeline agents) registered with an owner, a purpose, a distinct identity and a defined access scope?", "pt-br": "Todo agente de IA usado no SDLC (coding agents, review agents, custom agents, pipeline agents) está registrado com um responsável, um propósito, uma identidade distinta e um escopo de acesso definido?", "es": "¿Todo agente de IA usado en el SDLC (coding agents, review agents, custom agents, pipeline agents) está registrado con un responsable, un propósito, una identidad distinta y un alcance de acceso definido?"}, "anchors": {"l3": {"en": "A single inventory lists all agents with owner, platform and permissions; each agent runs under its own identity, not a shared human account.", "pt-br": "Um único inventário lista todos os agentes com responsável, plataforma e permissões; cada agente executa sob sua própria identidade, não uma conta humana compartilhada.", "es": "Un único inventario lista todos los agentes con responsable, plataforma y permisos; cada agente se ejecuta bajo su propia identidad, no una cuenta humana compartida."}, "l4": {"en": "Unregistered (\"shadow\") agents are detected automatically; identity lifecycle (creation, review, removal) is automated.", "pt-br": "Agentes não registrados (\"shadow\") são detectados automaticamente; o ciclo de vida de identidade (criação, revisão, remoção) é automatizado.", "es": "Los agentes no registrados (\"shadow\") se detectan automáticamente; el ciclo de vida de identidad (creación, revisión, eliminación) está automatizado."}}}]}, {"id": "D2", "name": {"en": "Enablement, Skills and Culture", "pt-br": "Capacitação, habilidades e cultura", "es": "Habilitación, habilidades y cultura"}, "why_it_matters": {"en": "Gartner expects GenAI to require 80% of the engineering workforce to upskill through 2027 [30]; DORA asks about training, peer learning and support for experimentation [2].", "pt-br": "O Gartner espera que GenAI exija que 80% da força de trabalho de engenharia se requalifique até 2027 [30]; DORA pergunta sobre treinamento, aprendizagem entre pares e suporte à experimentação [2].", "es": "Gartner espera que GenAI requiera que 80% de la fuerza laboral de ingeniería se capacite en nuevas habilidades hasta 2027 [30]; DORA pregunta sobre capacitación, aprendizaje entre pares y apoyo para la experimentación [2]."}, "questions": [{"id": "D2-Q1", "text": {"en": "Do engineers receive structured training on the approved AI tools and agent workflows, beyond the vendor's default onboarding?", "pt-br": "Os engenheiros recebem treinamento estruturado nas ferramentas de IA e workflows de agentes aprovados, além do onboarding padrão do fornecedor?", "es": "¿Los ingenieros reciben capacitación estructurada en las herramientas de IA aprobadas y workflows de agentes, más allá del onboarding predeterminado del proveedor?"}, "anchors": {"l3": {"en": "Role-based curriculum (developer, reviewer, platform, security) with completion tracked; training is required before agent features are enabled; it teaches learning-preserving patterns (ask for explanations, attempt first, then compare) and not only full delegation.", "pt-br": "Currículo baseado em função (desenvolvedor, revisor, plataforma, segurança) com conclusão rastreada; o treinamento é exigido antes que recursos de agentes sejam habilitados; ensina padrões que preservam o aprendizado (pedir explicações, tentar primeiro, depois comparar) e não apenas delegação total.", "es": "Currículo basado en rol (desarrollador, revisor, plataforma, seguridad) con finalización rastreada; la capacitación se exige antes de habilitar funciones de agentes; enseña patrones que preservan el aprendizaje (pedir explicaciones, intentar primero, luego comparar) y no solo delegación total."}, "l4": {"en": "Curriculum is updated each quarter from usage data and failure patterns; advanced tracks exist (agent orchestration, evaluation).", "pt-br": "O currículo é atualizado a cada trimestre com base em dados de uso e padrões de falha; existem trilhas avançadas (orquestração de agentes, avaliação).", "es": "El currículo se actualiza cada trimestre a partir de datos de uso y patrones de falla; existen rutas avanzadas (orquestación de agentes, evaluación)."}}}, {"id": "D2-Q2", "text": {"en": "Are there regular peer-learning formats (demos, brown bags, office hours) and a network of AI champions across teams?", "pt-br": "Existem formatos regulares de aprendizagem entre pares (demos, brown bags, office hours) e uma rede de champions de IA entre equipes?", "es": "¿Existen formatos regulares de aprendizaje entre pares (demos, brown bags, office hours) y una red de champions de IA en los equipos?"}, "anchors": {"l3": {"en": "Champions exist in most teams; sessions run at least monthly; recordings and examples are shared in one place.", "pt-br": "Champions existem na maioria das equipes; sessões ocorrem pelo menos mensalmente; gravações e exemplos são compartilhados em um único lugar.", "es": "Existen champions en la mayoría de los equipos; las sesiones se realizan al menos mensualmente; las grabaciones y ejemplos se comparten en un solo lugar."}, "l4": {"en": "A community of practice curates reusable assets (instructions, prompt files, agents) and measures their reuse.", "pt-br": "Uma comunidade de prática faz curadoria de ativos reutilizáveis (instruções, arquivos de prompt, agentes) e mede sua reutilização.", "es": "Una comunidad de práctica cura activos reutilizables (instrucciones, archivos de prompt, agentes) y mide su reutilización."}}}, {"id": "D2-Q3", "text": {"en": "Does the organization give engineers time, sandboxes and budget to experiment safely with new AI tools and agent patterns?", "pt-br": "A organização dá aos engenheiros tempo, sandboxes e orçamento para experimentar com segurança novas ferramentas de IA e padrões de agentes?", "es": "¿La organización da a los ingenieros tiempo, sandboxes y presupuesto para experimentar con seguridad con nuevas herramientas de IA y patrones de agentes?"}, "anchors": {"l3": {"en": "Sandboxed environments and a lightweight request path exist; experiments are logged and their results shared.", "pt-br": "Ambientes em sandbox e um caminho leve de solicitação existem; experimentos são registrados e seus resultados compartilhados.", "es": "Existen entornos en sandbox y una ruta liviana de solicitud; los experimentos se registran y sus resultados se comparten."}, "l4": {"en": "Successful experiments move into the approved catalog (D1-Q3) through a defined path within weeks.", "pt-br": "Experimentos bem-sucedidos entram no catálogo aprovado (D1-Q3) por meio de um caminho definido em semanas.", "es": "Los experimentos exitosos pasan al catálogo aprobado (D1-Q3) mediante una ruta definida en semanas."}}}, {"id": "D2-Q4", "text": {"en": "Are engineers trained to give AI tools the right context (clear task scoping, relevant files, constraints, examples) and to keep context lean?", "pt-br": "Os engenheiros são treinados para dar às ferramentas de IA o contexto correto (escopo claro da tarefa, arquivos relevantes, restrições, exemplos) e manter o contexto enxuto?", "es": "¿Los ingenieros están capacitados para dar a las herramientas de IA el contexto correcto (alcance claro de la tarea, archivos relevantes, restricciones, ejemplos) y mantener el contexto ajustado?"}, "anchors": {"l3": {"en": "Guidance and examples on context engineering are part of training; teams review their instructions and prompts for quality.", "pt-br": "Orientações e exemplos sobre engenharia de contexto fazem parte do treinamento; equipes revisam suas instruções e prompts quanto à qualidade.", "es": "La orientación y los ejemplos sobre ingeniería de contexto son parte de la capacitación; los equipos revisan la calidad de sus instrucciones y prompts."}, "l4": {"en": "Context practices are measured (for example success rate or token use per task) and improved over time.", "pt-br": "Práticas de contexto são medidas (por exemplo taxa de sucesso ou uso de tokens por tarefa) e melhoradas ao longo do tempo.", "es": "Las prácticas de contexto se miden (por ejemplo tasa de éxito o uso de tokens por tarea) y se mejoran con el tiempo."}}}, {"id": "D2-Q5", "text": {"en": "Have job descriptions, career frameworks and performance expectations been updated for AI-assisted and agentic engineering (for example directing agents, reviewing AI output, AI engineering)?", "pt-br": "Descrições de cargo, frameworks de carreira e expectativas de desempenho foram atualizados para engenharia assistida por IA e agentic engineering (por exemplo dirigir agentes, revisar saída de IA, engenharia de IA)?", "es": "¿Se actualizaron descripciones de puesto, frameworks de carrera y expectativas de desempeño para ingeniería asistida por IA y agentic engineering (por ejemplo dirigir agentes, revisar salida de IA, ingeniería de IA)?"}, "anchors": {"l3": {"en": "Updated role profiles are published; performance reviews recognize effective AI use and review quality, not raw output volume.", "pt-br": "Perfis de função atualizados são publicados; avaliações de desempenho reconhecem uso efetivo de IA e qualidade de review, não volume bruto de saída.", "es": "Se publican perfiles de rol actualizados; las evaluaciones de desempeño reconocen el uso efectivo de IA y la calidad del review, no el volumen bruto de salida."}, "l4": {"en": "Dedicated roles exist (for example AI engineer, agent platform owner) with a clear growth path.", "pt-br": "Existem funções dedicadas (por exemplo engenheiro de IA, responsável pela plataforma de agentes) com um caminho claro de crescimento.", "es": "Existen roles dedicados (por ejemplo ingeniero de IA, responsable de plataforma de agentes) con una ruta clara de crecimiento."}}}, {"id": "D2-Q6", "text": {"en": "Do new engineers use AI tools to understand codebases and become productive, with ramp-up time measured?", "pt-br": "Novos engenheiros usam ferramentas de IA para entender codebases e se tornarem produtivos, com tempo de ramp-up medido?", "es": "¿Los nuevos ingenieros usan herramientas de IA para entender codebases y volverse productivos, con tiempo de ramp-up medido?"}, "anchors": {"l3": {"en": "Onboarding includes AI-guided codebase tours and repository instructions; time to first merged PR is tracked; new engineers are checked on code reading and debugging, not only output.", "pt-br": "O onboarding inclui tours de codebase guiados por IA e instruções de repositório; tempo até o primeiro PR mergeado é rastreado; novos engenheiros são avaliados em leitura de code e debugging, não apenas em saída.", "es": "El onboarding incluye recorridos de codebase guiados por IA e instrucciones de repositorio; se rastrea el tiempo hasta el primer PR mergeado; los nuevos ingenieros son evaluados en lectura de code y debugging, no solo en salida."}, "l4": {"en": "Ramp-up and skill metrics are compared across cohorts and used to improve onboarding material and instructions.", "pt-br": "Métricas de ramp-up e habilidades são comparadas entre coortes e usadas para melhorar material e instruções de onboarding.", "es": "Las métricas de ramp-up y habilidades se comparan entre cohortes y se usan para mejorar material e instrucciones de onboarding."}}}]}, {"id": "D3", "name": {"en": "Plan, Specify and Design", "pt-br": "Planejar, especificar e desenhar", "es": "Planificar, especificar y diseñar"}, "why_it_matters": {"en": "in agentic coding, \"people make most of the planning decisions (what to do) and Claude makes most of the execution decisions (how to do it)\" [24]; the quality of the task definition drives the quality of agent output [8], [27].", "pt-br": "em agentic coding, \"as pessoas tomam a maior parte das decisões de planejamento (o que fazer) e Claude toma a maior parte das decisões de execução (como fazer)\" [24]; a qualidade da definição da tarefa impulsiona a qualidade da saída do agente [8], [27].", "es": "en agentic coding, \"las personas toman la mayoría de las decisiones de planificación (qué hacer) y Claude toma la mayoría de las decisiones de ejecución (cómo hacerlo)\" [24]; la calidad de la definición de la tarea impulsa la calidad de la salida del agente [8], [27]."}, "questions": [{"id": "D3-Q1", "text": {"en": "Is AI used to draft and refine issues or user stories, including acceptance criteria, with a human owner who approves them?", "pt-br": "IA é usada para redigir e refinar issues ou user stories, incluindo critérios de aceite, com um responsável humano que as aprova?", "es": "¿Se usa IA para redactar y refinar issues o user stories, incluidos criterios de aceptación, con un responsable humano que las aprueba?"}, "anchors": {"l3": {"en": "Most teams use AI to draft or improve work items; acceptance criteria are mandatory before work starts.", "pt-br": "A maioria das equipes usa IA para redigir ou melhorar itens de trabalho; critérios de aceite são obrigatórios antes do trabalho começar.", "es": "La mayoría de los equipos usa IA para redactar o mejorar elementos de trabajo; los criterios de aceptación son obligatorios antes de comenzar el trabajo."}, "l4": {"en": "Work-item quality (clarity, testability) is measured and linked to rework and cycle time.", "pt-br": "A qualidade dos itens de trabalho (clareza, testabilidade) é medida e vinculada a retrabalho e cycle time.", "es": "La calidad de los elementos de trabajo (claridad, capacidad de prueba) se mide y se vincula con retrabajo y cycle time."}}}, {"id": "D3-Q2", "text": {"en": "For non-trivial changes, is a written plan or specification produced and reviewed before an AI agent implements the change?", "pt-br": "Para mudanças não triviais, um plano ou especificação escrito é produzido e revisado antes que um agente de IA implemente a mudança?", "es": "Para cambios no triviales, ¿se produce y revisa un plan o especificación por escrito antes de que un agente de IA implemente el cambio?"}, "anchors": {"l3": {"en": "Plans or specs are stored in the repository or linked to the issue, and are reviewed by a human before agent implementation.", "pt-br": "Planos ou specs são armazenados no repositório ou vinculados à issue, e são revisados por um humano antes da implementação pelo agente.", "es": "Los planes o specs se almacenan en el repositorio o se vinculan a la issue, y un humano los revisa antes de la implementación por el agente."}, "l4": {"en": "Specs are the contract for automated verification (tests, checks) and are kept in sync with the code.", "pt-br": "Specs são o contrato para verificação automatizada (testes, checks) e são mantidas sincronizadas com o code.", "es": "Las specs son el contrato para verificación automatizada (pruebas, checks) y se mantienen sincronizadas con el code."}}}, {"id": "D3-Q3", "text": {"en": "Are tasks given to coding agents well scoped (small, with clear acceptance criteria and pointers to relevant code) before assignment?", "pt-br": "As tarefas dadas a coding agents são bem delimitadas (pequenas, com critérios de aceite claros e ponteiros para code relevante) antes da atribuição?", "es": "¿Las tareas dadas a coding agents están bien delimitadas (pequeñas, con criterios de aceptación claros y punteros a code relevante) antes de asignarse?"}, "anchors": {"l3": {"en": "Teams follow written guidance for agent-ready issues; oversized tasks are split before assignment.", "pt-br": "Equipes seguem orientação escrita para issues prontas para agentes; tarefas grandes demais são divididas antes da atribuição.", "es": "Los equipos siguen orientación escrita para issues listas para agentes; las tareas demasiado grandes se dividen antes de la asignación."}, "l4": {"en": "Agent task success and rework rates are tracked per task type and used to refine the guidance.", "pt-br": "Sucesso de tarefas de agentes e taxas de retrabalho são rastreados por tipo de tarefa e usados para refinar a orientação.", "es": "El éxito de tareas de agentes y las tasas de retrabajo se rastrean por tipo de tarea y se usan para refinar la orientación."}}}, {"id": "D3-Q4", "text": {"en": "Is AI used to support design work (option analysis, threat and failure modes, architecture decision records) while decisions stay with accountable humans?", "pt-br": "IA é usada para apoiar trabalho de design (análise de opções, modos de ameaça e falha, architecture decision records), enquanto as decisões permanecem com humanos responsáveis?", "es": "¿Se usa IA para apoyar el trabajo de diseño (análisis de opciones, modos de amenaza y falla, architecture decision records) mientras las decisiones permanecen con humanos responsables?"}, "anchors": {"l3": {"en": "ADRs are versioned; AI-assisted analysis is attached; a named human approves each decision.", "pt-br": "ADRs são versionados; análise assistida por IA é anexada; um humano nomeado aprova cada decisão.", "es": "Los ADRs se versionan; se adjunta análisis asistido por IA; un humano nombrado aprueba cada decisión."}, "l4": {"en": "Agents check new changes against recorded decisions and flag conflicts automatically.", "pt-br": "Agentes verificam novas mudanças contra decisões registradas e sinalizam conflitos automaticamente.", "es": "Los agentes verifican nuevos cambios contra decisiones registradas y señalan conflictos automáticamente."}}}, {"id": "D3-Q5", "text": {"en": "Is AI-assisted work tied to clear user outcomes and informed by user feedback?", "pt-br": "O trabalho assistido por IA está vinculado a resultados claros para usuários e informado por feedback de usuários?", "es": "¿El trabajo asistido por IA está vinculado a resultados claros para usuarios e informado por feedback de usuarios?"}, "anchors": {"l3": {"en": "Work items reference the user problem and success measure; feedback is reviewed before prioritization.", "pt-br": "Itens de trabalho referenciam o problema do usuário e a medida de sucesso; feedback é revisado antes da priorização.", "es": "Los elementos de trabajo referencian el problema del usuario y la medida de éxito; el feedback se revisa antes de priorizar."}, "l4": {"en": "User-outcome metrics are part of the definition of done for AI-assisted delivery.", "pt-br": "Métricas de resultado do usuário fazem parte da definition of done para entrega assistida por IA.", "es": "Las métricas de resultado del usuario son parte de la definition of done para entrega asistida por IA."}}}, {"id": "D3-Q6", "text": {"en": "Are AI tools and agents used to understand, upgrade and migrate legacy code (for example framework or runtime upgrades, cloud migration), with results verified by tests?", "pt-br": "Ferramentas e agentes de IA são usados para entender, fazer upgrade e migrar code legado (por exemplo upgrades de framework ou runtime, migração para cloud), com resultados verificados por testes?", "es": "¿Se usan herramientas y agentes de IA para entender, hacer upgrade y migrar code legado (por ejemplo upgrades de framework o runtime, migración a cloud), con resultados verificados por pruebas?"}, "anchors": {"l3": {"en": "A repeatable AI-assisted modernization process exists for common upgrade types, with test gates.", "pt-br": "Existe um processo repetível de modernização assistida por IA para tipos comuns de upgrade, com gates de teste.", "es": "Existe un proceso repetible de modernización asistida por IA para tipos comunes de upgrade, con gates de prueba."}, "l4": {"en": "Modernization backlog is burned down continuously by agents under human review, with tracked success rates.", "pt-br": "O backlog de modernização é reduzido continuamente por agentes sob review humano, com taxas de sucesso rastreadas.", "es": "El backlog de modernización se reduce continuamente mediante agentes bajo review humano, con tasas de éxito rastreadas."}}}]}, {"id": "D4", "name": {"en": "Code and Context Engineering", "pt-br": "Code e engenharia de contexto", "es": "Code e ingeniería de contexto"}, "why_it_matters": {"en": "GitHub measures adoption depth as a progression from \"Code first\" to \"Agent first\" to \"Multi-agent\" [6]; Anthropic describes context as \"a finite resource with diminishing marginal returns\" [25].", "pt-br": "GitHub mede a profundidade de adoção como uma progressão de \"Code first\" para \"Agent first\" e \"Multi-agent\" [6]; a Anthropic descreve contexto como \"um recurso finito com retornos marginais decrescentes\" [25].", "es": "GitHub mide la profundidad de adopción como una progresión de \"Code first\" a \"Agent first\" y \"Multi-agent\" [6]; Anthropic describe el contexto como \"un recurso finito con retornos marginales decrecientes\" [25]."}, "questions": [{"id": "D4-Q1", "text": {"en": "How deeply do engineers use AI across surfaces: completions and agent edits in the IDE, GitHub agent surfaces (cloud agent, code review, CLI), and several agents together?", "pt-br": "Quão profundamente os engenheiros usam IA entre superfícies: completions e edições de agentes no IDE, superfícies de agentes do GitHub (cloud agent, code review, CLI), e vários agentes juntos?", "es": "¿Qué tan profundamente usan IA los ingenieros entre superficies: completions y ediciones de agentes en el IDE, superficies de agentes de GitHub (cloud agent, code review, CLI), y varios agentes juntos?"}, "anchors": {"l3": {"en": "Many engineers regularly use at least one GitHub agent surface (\"Agent first\"), confirmed by usage metrics.", "pt-br": "Muitos engenheiros usam regularmente pelo menos uma superfície de agente do GitHub (\"Agent first\"), confirmado por métricas de uso.", "es": "Muchos ingenieros usan regularmente al menos una superficie de agente de GitHub (\"Agent first\"), confirmado por métricas de uso."}, "l4": {"en": "Multi-agent use is normal (\"Multi-agent\"), with cohort distribution tracked monthly.", "pt-br": "Uso multi-agent é normal (\"Multi-agent\"), com distribuição de coortes rastreada mensalmente.", "es": "El uso multi-agent es normal (\"Multi-agent\"), con distribución de cohortes rastreada mensualmente."}, "l1_l2": {"en": "Mostly completions and chat (\"Code first\").", "pt-br": "Principalmente completions e chat (\"Code first\").", "es": "Principalmente completions y chat (\"Code first\")."}}}, {"id": "D4-Q2", "text": {"en": "Do engineers use IDE agent mode (or equivalent) for multi-file changes, and review every change before committing?", "pt-br": "Os engenheiros usam IDE agent mode (ou equivalente) para mudanças multi-file, e revisam toda mudança antes de fazer commit?", "es": "¿Los ingenieros usan IDE agent mode (o equivalente) para cambios multi-file, y revisan cada cambio antes de hacer commit?"}, "anchors": {"l3": {"en": "Agent mode is the default for multi-file refactors and features in most teams; changes are reviewed in the diff before commit.", "pt-br": "Agent mode é o padrão para refactors e features multi-file na maioria das equipes; mudanças são revisadas no diff antes do commit.", "es": "Agent mode es el valor predeterminado para refactors y features multi-file en la mayoría de los equipos; los cambios se revisan en el diff antes del commit."}, "l4": {"en": "Teams share agent-mode patterns that work and track where it fails; tool permissions are tuned per repository.", "pt-br": "Equipes compartilham padrões de agent mode que funcionam e rastreiam onde ele falha; permissões de ferramentas são ajustadas por repositório.", "es": "Los equipos comparten patrones de agent mode que funcionan y rastrean dónde falla; los permisos de herramientas se ajustan por repositorio."}}}, {"id": "D4-Q3", "text": {"en": "Are coding agents (for example Copilot cloud agent) assigned issues and producing pull requests that are merged after human review?", "pt-br": "Coding agents (por exemplo Copilot cloud agent) recebem issues e produzem pull requests que são mergeados após review humano?", "es": "¿Se asignan issues a coding agents (por ejemplo Copilot cloud agent) y estos producen pull requests que se mergean después de review humano?"}, "anchors": {"l3": {"en": "Most teams delegate suitable issues to a coding agent; the share of merged PRs that are agent-authored is tracked.", "pt-br": "A maioria das equipes delega issues adequadas a um coding agent; a parcela de PRs mergeados que são criados por agentes é rastreada.", "es": "La mayoría de los equipos delega issues adecuadas a un coding agent; se rastrea la proporción de PRs mergeados creados por agentes."}, "l4": {"en": "Agent PR merge rate, rework and post-merge fix rate are tracked by task type; delegation rules (D1-Q5) are tuned from this data.", "pt-br": "Taxa de merge de PRs de agentes, retrabalho e taxa de correções pós-merge são rastreadas por tipo de tarefa; regras de delegação (D1-Q5) são ajustadas a partir desses dados.", "es": "La tasa de merge de PRs de agentes, el retrabajo y la tasa de correcciones post-merge se rastrean por tipo de tarea; las reglas de delegación (D1-Q5) se ajustan a partir de estos datos."}}}, {"id": "D4-Q4", "text": {"en": "Do repositories contain versioned, reviewed custom instructions for AI tools (for example `.github/copilot-instructions.md`, `AGENTS.md`) describing build, test, conventions and constraints?", "pt-br": "Os repositórios contêm custom instructions versionadas e revisadas para ferramentas de IA (por exemplo `.github/copilot-instructions.md`, `AGENTS.md`) descrevendo build, test, convenções e restrições?", "es": "¿Los repositorios contienen custom instructions versionadas y revisadas para herramientas de IA (por ejemplo `.github/copilot-instructions.md`, `AGENTS.md`) que describen build, test, convenciones y restricciones?"}, "anchors": {"l3": {"en": "Most active repositories have structured instructions (build, test, conventions, constraints) with an owner; changes go through PR review; files are updated when the codebase changes rather than committed once.", "pt-br": "A maioria dos repositórios ativos tem instruções estruturadas (build, test, convenções, restrições) com um responsável; mudanças passam por PR review; arquivos são atualizados quando o codebase muda, em vez de serem commitados uma vez.", "es": "La mayoría de los repositorios activos tiene instrucciones estructuradas (build, test, convenciones, restricciones) con un responsable; los cambios pasan por PR review; los archivos se actualizan cuando el codebase cambia en vez de commitarlos una sola vez."}, "l4": {"en": "Instructions are generated from a shared baseline, checked for staleness, and their effect on agent merge rate and code quality is measured, since instruction files alone do not guarantee better results.", "pt-br": "Instruções são geradas a partir de uma base compartilhada, verificadas quanto a desatualização, e seu efeito na taxa de merge de agentes e na qualidade de code é medido, já que arquivos de instrução sozinhos não garantem melhores resultados.", "es": "Las instrucciones se generan a partir de una base compartida, se verifican por obsolescencia, y se mide su efecto en la tasa de merge de agentes y calidad de code, ya que los archivos de instrucciones por sí solos no garantizan mejores resultados."}}}, {"id": "D4-Q5", "text": {"en": "Is there a curated, shared library of reusable prompt files, custom agents and skills, with owners and versioning?", "pt-br": "Existe uma biblioteca compartilhada e curada de arquivos de prompt, custom agents e skills reutilizáveis, com responsáveis e versionamento?", "es": "¿Existe una biblioteca compartida y curada de archivos de prompt, custom agents y skills reutilizables, con responsables y versionado?"}, "anchors": {"l3": {"en": "A central repository holds approved prompt files and custom agents; teams reuse them instead of copying.", "pt-br": "Um repositório central contém arquivos de prompt e custom agents aprovados; equipes os reutilizam em vez de copiar.", "es": "Un repositorio central contiene archivos de prompt y custom agents aprobados; los equipos los reutilizan en vez de copiarlos."}, "l4": {"en": "Assets are evaluated before release (quality, cost), usage is tracked, and unused assets are retired.", "pt-br": "Ativos são avaliados antes do release (qualidade, custo), o uso é rastreado, e ativos não usados são retirados.", "es": "Los activos se evalúan antes del release (calidad, costo), el uso se rastrea y los activos no usados se retiran."}}}, {"id": "D4-Q6", "text": {"en": "Are MCP servers and other agent tools governed through an allowlist or registry, with scoped tools and named owners?", "pt-br": "MCP servers e outras ferramentas de agentes são governados por uma allowlist ou registry, com ferramentas em escopo e responsáveis nomeados?", "es": "¿Los MCP servers y otras herramientas de agentes se gobiernan mediante una allowlist o registry, con herramientas acotadas y responsables nombrados?"}, "anchors": {"l3": {"en": "An enterprise MCP allowlist or custom registry is enforced; each server has an owner, a security review and limited tools.", "pt-br": "Uma allowlist enterprise de MCP ou registry customizado é aplicada; cada server tem um responsável, uma security review e ferramentas limitadas.", "es": "Se aplica una allowlist enterprise de MCP o un registry customizado; cada server tiene un responsable, una security review y herramientas limitadas."}, "l4": {"en": "Tool calls are logged and reviewed; new servers pass automated security checks before being added.", "pt-br": "Tool calls são registrados e revisados; novos servers passam por security checks automatizados antes de serem adicionados.", "es": "Las tool calls se registran y revisan; los nuevos servers pasan security checks automatizados antes de agregarse."}}}, {"id": "D4-Q7", "text": {"en": "Can AI tools and agents securely use internal sources (code, documentation, wikis, work items) as context, through approved connectors?", "pt-br": "Ferramentas e agentes de IA conseguem usar com segurança fontes internas (code, documentação, wikis, itens de trabalho) como contexto, por meio de conectores aprovados?", "es": "¿Las herramientas y agentes de IA pueden usar de forma segura fuentes internas (code, documentación, wikis, elementos de trabajo) como contexto, mediante conectores aprobados?"}, "anchors": {"l3": {"en": "Approved connectors give AI tools permission-aware access to the main internal sources; responses cite internal material.", "pt-br": "Conectores aprovados dão às ferramentas de IA acesso ciente de permissões às principais fontes internas; respostas citam material interno.", "es": "Los conectores aprobados dan a las herramientas de IA acceso consciente de permisos a las principales fuentes internas; las respuestas citan material interno."}, "l4": {"en": "Knowledge sources are curated for AI use (freshness, ownership) and retrieval quality is evaluated.", "pt-br": "Fontes de conhecimento são curadas para uso por IA (atualização, ownership) e a qualidade de retrieval é avaliada.", "es": "Las fuentes de conocimiento se curan para uso de IA (actualidad, ownership) y se evalúa la calidad de retrieval."}}}, {"id": "D4-Q8", "text": {"en": "Is model choice matched to task complexity (smaller models for routine work, frontier models for complex work), by guidance or automatic routing?", "pt-br": "A escolha do modelo é combinada à complexidade da tarefa (modelos menores para trabalho rotineiro, frontier models para trabalho complexo), por orientação ou roteamento automático?", "es": "¿La elección del modelo se ajusta a la complejidad de la tarea (modelos más pequeños para trabajo rutinario, frontier models para trabajo complejo), mediante orientación o enrutamiento automático?"}, "anchors": {"l3": {"en": "Written guidance maps task types to models; default models are set by policy.", "pt-br": "Orientação escrita mapeia tipos de tarefa a modelos; modelos padrão são definidos por política.", "es": "La orientación escrita mapea tipos de tarea a modelos; los modelos predeterminados se establecen por política."}, "l4": {"en": "Automatic routing is in place and tuned from cost and quality data.", "pt-br": "Roteamento automático está em vigor e é ajustado a partir de dados de custo e qualidade.", "es": "El enrutamiento automático está implementado y se ajusta con datos de costo y calidad."}}}]}, {"id": "D5", "name": {"en": "Review, Quality and Testing", "pt-br": "Review, qualidade e testes", "es": "Review, calidad y pruebas"}, "why_it_matters": {"en": "DORA links AI-driven change volume to instability unless strong control systems exist [3]; GitHub requires human review before agent PRs merge [7]; 46% of developers distrust AI output accuracy [37].", "pt-br": "DORA vincula o volume de mudanças impulsionadas por IA à instabilidade, a menos que existam sistemas de controle fortes [3]; GitHub exige revisão humana antes que PRs de agentes sejam mergeados [7]; 46% dos desenvolvedores desconfiam da precisão da saída de IA [37].", "es": "DORA vincula el volumen de cambios impulsados por IA con la inestabilidad, a menos que existan sistemas de control sólidos [3]; GitHub exige revisión humana antes de que se mergeen PRs de agentes [7]; 46% de los desarrolladores desconfían de la precisión de la salida de IA [37]."}, "questions": [{"id": "D5-Q1", "text": {"en": "Is AI code review (for example Copilot code review) applied to pull requests, with a human reviewer still accountable for approval?", "pt-br": "AI code review (por exemplo Copilot code review) é aplicado a pull requests, com um revisor humano ainda responsável pela aprovação?", "es": "¿AI code review (por ejemplo Copilot code review) se aplica a pull requests, con un revisor humano aún responsable de la aprobación?"}, "anchors": {"l3": {"en": "AI review runs automatically on most PRs; teams track useful vs dismissed suggestions.", "pt-br": "AI review executa automaticamente na maioria dos PRs; equipes rastreiam sugestões úteis versus descartadas.", "es": "AI review se ejecuta automáticamente en la mayoría de los PRs; los equipos rastrean sugerencias útiles versus descartadas."}, "l4": {"en": "Review rules are tuned per repository from suggestion outcomes; review time and escaped defects are tracked; PRs where only AI reviewed AI-authored code are visible and governed.", "pt-br": "Regras de review são ajustadas por repositório a partir dos resultados de sugestões; tempo de review e defeitos escapados são rastreados; PRs em que apenas IA revisou code criado por IA são visíveis e governados.", "es": "Las reglas de review se ajustan por repositorio a partir de los resultados de sugerencias; se rastrean tiempo de review y defectos escapados; los PRs donde solo IA revisó code creado por IA son visibles y gobernados."}}}, {"id": "D5-Q2", "text": {"en": "Do agent-authored pull requests require independent human approval (not the requester), with workflow runs approved before they execute?", "pt-br": "Pull requests criados por agentes exigem aprovação humana independente (não o solicitante), com workflow runs aprovadas antes de executarem?", "es": "¿Los pull requests creados por agentes requieren aprobación humana independiente (no el solicitante), con workflow runs aprobadas antes de ejecutarse?"}, "anchors": {"l3": {"en": "Default protections are kept: agent PRs need an independent approver; \"Approve and run workflows\" is not disabled without a documented risk decision.", "pt-br": "Proteções padrão são mantidas: PRs de agentes precisam de um aprovador independente; \"Approve and run workflows\" não é desabilitado sem uma decisão de risco documentada.", "es": "Se mantienen las protecciones predeterminadas: los PRs de agentes necesitan un aprobador independiente; \"Approve and run workflows\" no se deshabilita sin una decisión de riesgo documentada."}, "l4": {"en": "Approval requirements scale with risk (D1-Q5) and are audited; exceptions expire automatically.", "pt-br": "Requisitos de aprovação escalam com o risco (D1-Q5) e são auditados; exceções expiram automaticamente.", "es": "Los requisitos de aprobación escalan con el riesgo (D1-Q5) y se auditan; las excepciones expiran automáticamente."}}}, {"id": "D5-Q3", "text": {"en": "Do AI-generated and agent-authored changes pass the same required checks (build, tests, linting, security scans, coverage) as human changes?", "pt-br": "Mudanças geradas por IA e criadas por agentes passam pelos mesmos checks exigidos (build, tests, linting, security scans, coverage) que mudanças humanas?", "es": "¿Los cambios generados por IA y creados por agentes pasan los mismos checks requeridos (build, tests, linting, security scans, coverage) que los cambios humanos?"}, "anchors": {"l3": {"en": "Required checks are enforced by rulesets on the protected branches of most repositories, with no bypass for agent identities.", "pt-br": "Checks exigidos são aplicados por rulesets nos protected branches da maioria dos repositórios, sem bypass para identidades de agentes.", "es": "Los checks requeridos se aplican mediante rulesets en los protected branches de la mayoría de los repositorios, sin bypass para identidades de agentes."}, "l4": {"en": "Gates are policy as code, applied across all repositories (>90%) and reviewed after incidents.", "pt-br": "Gates são policy as code, aplicados em todos os repositórios (>90%) e revisados após incidentes.", "es": "Los gates son policy as code, aplicados en todos los repositorios (>90%) y revisados después de incidentes."}}}, {"id": "D5-Q4", "text": {"en": "Are changes kept small (limits on PR size, one concern per PR), including changes produced by agents?", "pt-br": "As mudanças são mantidas pequenas (limites de tamanho de PR, uma preocupação por PR), incluindo mudanças produzidas por agentes?", "es": "¿Los cambios se mantienen pequeños (límites de tamaño de PR, un tema por PR), incluidos los cambios producidos por agentes?"}, "anchors": {"l3": {"en": "PR size guidance is enforced or monitored; oversized agent PRs are split before review.", "pt-br": "Orientação de tamanho de PR é aplicada ou monitorada; PRs de agentes grandes demais são divididos antes do review.", "es": "La orientación de tamaño de PR se aplica o monitorea; los PRs de agentes demasiado grandes se dividen antes del review."}, "l4": {"en": "Batch size is tracked against change failure rate and review time and used to adjust limits.", "pt-br": "Tamanho de lote é rastreado em relação a change failure rate e tempo de review, e usado para ajustar limites.", "es": "El tamaño de lote se rastrea contra change failure rate y tiempo de review, y se usa para ajustar límites."}}}, {"id": "D5-Q5", "text": {"en": "Is AI used to generate and maintain tests, with test quality checked (for example coverage of changed code, mutation testing) rather than only test count?", "pt-br": "IA é usada para gerar e manter testes, com qualidade dos testes verificada (por exemplo coverage do code alterado, mutation testing) em vez de apenas contagem de testes?", "es": "¿Se usa IA para generar y mantener pruebas, con calidad de pruebas verificada (por ejemplo coverage del code cambiado, mutation testing) en vez de solo conteo de pruebas?"}, "anchors": {"l3": {"en": "Most teams use AI to write tests; coverage of changed lines is a required check.", "pt-br": "A maioria das equipes usa IA para escrever testes; coverage de linhas alteradas é um check exigido.", "es": "La mayoría de los equipos usa IA para escribir pruebas; coverage de líneas cambiadas es un check requerido."}, "l4": {"en": "Test effectiveness (mutation score, escaped defects) is tracked; flaky tests are detected and quarantined automatically.", "pt-br": "Efetividade dos testes (mutation score, defeitos escapados) é rastreada; flaky tests são detectados e colocados em quarentena automaticamente.", "es": "La efectividad de pruebas (mutation score, defectos escapados) se rastrea; flaky tests se detectan y se ponen en cuarentena automáticamente."}}}, {"id": "D5-Q6", "text": {"en": "Do engineers systematically verify AI output (run it, test it, read it) and is trust in AI output measured over time?", "pt-br": "Os engenheiros verificam sistematicamente a saída de IA (executam, testam, leem) e a confiança na saída de IA é medida ao longo do tempo?", "es": "¿Los ingenieros verifican sistemáticamente la salida de IA (la ejecutan, la prueban, la leen) y se mide la confianza en la salida de IA con el tiempo?"}, "anchors": {"l3": {"en": "Review guidelines explain what to check in AI output; trust in AI output is part of the developer survey.", "pt-br": "Diretrizes de review explicam o que verificar na saída de IA; confiança na saída de IA faz parte da pesquisa com desenvolvedores.", "es": "Las directrices de review explican qué verificar en la salida de IA; la confianza en la salida de IA es parte de la encuesta a desarrolladores."}, "l4": {"en": "Trust and accuracy are compared with real defect data, and guidance is updated where they diverge.", "pt-br": "Confiança e precisão são comparadas com dados reais de defeitos, e a orientação é atualizada onde divergem.", "es": "La confianza y la precisión se comparan con datos reales de defectos, y la orientación se actualiza donde divergen."}}}, {"id": "D5-Q7", "text": {"en": "Is the long-term health of AI-generated code monitored (duplication, churn, complexity, maintainability)?", "pt-br": "A saúde de longo prazo do code gerado por IA é monitorada (duplicação, churn, complexidade, manutenibilidade)?", "es": "¿Se monitorea la salud de largo plazo del code generado por IA (duplicación, churn, complejidad, mantenibilidad)?"}, "anchors": {"l3": {"en": "Code-health metrics are collected for most repositories and reviewed in team retrospectives; AI-generated code has a named human owner.", "pt-br": "Métricas de code health são coletadas para a maioria dos repositórios e revisadas em retrospectivas de equipe; code gerado por IA tem um responsável humano nomeado.", "es": "Se recopilan métricas de code health para la mayoría de los repositorios y se revisan en retrospectivas de equipo; el code generado por IA tiene un responsable humano nombrado."}, "l4": {"en": "Health trends (for example cognitive complexity, static-analysis warnings) are compared between AI-heavy and other code, with corrective actions tracked.", "pt-br": "Tendências de saúde (por exemplo complexidade cognitiva, avisos de static analysis) são comparadas entre code com alta presença de IA e outros codes, com ações corretivas rastreadas.", "es": "Las tendencias de salud (por ejemplo complejidad cognitiva, advertencias de static analysis) se comparan entre code con alta presencia de IA y otro code, con acciones correctivas rastreadas."}}}]}, {"id": "D6", "name": {"en": "Security and AI Supply Chain", "pt-br": "Segurança e AI Supply Chain", "es": "Seguridad y AI Supply Chain"}, "why_it_matters": {"en": "OWASP lists prompt injection (LLM01), supply chain (LLM03) and excessive agency (LLM06) among the top risks [38], and agent goal hijack (ASI01) first for agentic applications [39]; NIST SP 800-218A adds AI-specific practices to the SSDF [40].", "pt-br": "OWASP lista prompt injection (LLM01), supply chain (LLM03) e agência excessiva (LLM06) entre os principais riscos [38], e agent goal hijack (ASI01) em primeiro lugar para aplicações agentic [39]; NIST SP 800-218A adiciona práticas específicas de IA ao SSDF [40].", "es": "OWASP enumera prompt injection (LLM01), supply chain (LLM03) y agencia excesiva (LLM06) entre los principales riesgos [38], y agent goal hijack (ASI01) en primer lugar para aplicaciones agentic [39]; NIST SP 800-218A agrega prácticas específicas de IA al SSDF [40]."}, "questions": [{"id": "D6-Q1", "text": {"en": "Are code scanning (SAST), secret scanning with push protection, and dependency review applied to all repositories, including agent branches?", "pt-br": "Code scanning (SAST), secret scanning com push protection e dependency review são aplicados a todos os repositórios, incluindo branches de agentes?", "es": "¿Code scanning (SAST), secret scanning con push protection y dependency review se aplican a todos los repositorios, incluidas branches de agentes?"}, "anchors": {"l3": {"en": "Enabled by default for all new and most existing repositories; push protection applies to every commit, human or agent; alerts have owners and service-level targets.", "pt-br": "Habilitado por padrão para todos os repositórios novos e a maioria dos existentes; push protection se aplica a todo commit, humano ou de agente; alertas têm responsáveis e metas de nível de serviço.", "es": "Habilitado por defecto para todos los repositorios nuevos y la mayoría de los existentes; push protection se aplica a todo commit, humano o de agente; las alertas tienen responsables y objetivos de nivel de servicio."}, "l4": {"en": "Coverage is near complete and verified automatically; mean time to remediate is tracked.", "pt-br": "A cobertura é quase completa e verificada automaticamente; mean time to remediate é rastreado.", "es": "La cobertura es casi completa y se verifica automáticamente; mean time to remediate se rastrea."}}}, {"id": "D6-Q2", "text": {"en": "Is AI-assisted remediation (for example autofix for code scanning) used to fix vulnerabilities, with fixes reviewed and tested before merge?", "pt-br": "Remediação assistida por IA (por exemplo autofix para code scanning) é usada para corrigir vulnerabilidades, com correções revisadas e testadas antes do merge?", "es": "¿Se usa remediación asistida por IA (por ejemplo autofix para code scanning) para corregir vulnerabilidades, con correcciones revisadas y probadas antes del merge?"}, "anchors": {"l3": {"en": "Autofix suggestions are enabled for most repositories; acceptance and reopen rates are tracked.", "pt-br": "Sugestões de autofix são habilitadas para a maioria dos repositórios; taxas de aceitação e reabertura são rastreadas.", "es": "Las sugerencias de autofix están habilitadas para la mayoría de los repositorios; se rastrean tasas de aceptación y reapertura."}, "l4": {"en": "Security campaigns use AI remediation at scale, and remediation time is reported to leadership.", "pt-br": "Campanhas de segurança usam remediação com IA em escala, e o tempo de remediação é reportado à liderança.", "es": "Las campañas de seguridad usan remediación con IA a escala, y el tiempo de remediación se informa al liderazgo."}}}, {"id": "D6-Q3", "text": {"en": "Are agents protected against prompt injection and goal hijack (untrusted content treated as data, hidden instructions filtered, network egress restricted)?", "pt-br": "Agentes são protegidos contra prompt injection e goal hijack (conteúdo não confiável tratado como dados, instruções ocultas filtradas, saída de rede restrita)?", "es": "¿Los agentes están protegidos contra prompt injection y goal hijack (contenido no confiable tratado como datos, instrucciones ocultas filtradas, egress de red restringido)?"}, "anchors": {"l3": {"en": "Agent firewalls and egress restrictions are kept on; guidance tells teams which content sources are untrusted.", "pt-br": "Agent firewalls e restrições de egress permanecem ativados; a orientação informa às equipes quais fontes de conteúdo não são confiáveis.", "es": "Agent firewalls y restricciones de egress se mantienen activados; la orientación indica a los equipos qué fuentes de contenido no son confiables."}, "l4": {"en": "Agents are red-teamed regularly against OWASP LLM01 and ASI01 scenarios; findings are tracked to closure.", "pt-br": "Agentes passam regularmente por red team contra cenários OWASP LLM01 e ASI01; achados são rastreados até o fechamento.", "es": "Los agentes pasan regularmente por red team contra escenarios OWASP LLM01 y ASI01; los hallazgos se rastrean hasta el cierre."}}}, {"id": "D6-Q4", "text": {"en": "Do agents run with least privilege (scoped tokens, no production secrets, restricted branches, sandboxed environments)?", "pt-br": "Agentes executam com least privilege (tokens com escopo, sem segredos de produção, branches restritos, ambientes em sandbox)?", "es": "¿Los agentes se ejecutan con least privilege (tokens con alcance, sin secretos de producción, branches restringidos, entornos en sandbox)?"}, "anchors": {"l3": {"en": "Agent permissions are documented and reviewed; agents cannot reach production credentials or push to protected branches.", "pt-br": "Permissões de agentes são documentadas e revisadas; agentes não conseguem acessar credenciais de produção nem fazer push para protected branches.", "es": "Los permisos de agentes se documentan y revisan; los agentes no pueden acceder a credenciales de producción ni hacer push a protected branches."}, "l4": {"en": "Permissions are just-in-time and time-bound; access is reviewed automatically.", "pt-br": "Permissões são just-in-time e limitadas no tempo; o acesso é revisado automaticamente.", "es": "Los permisos son just-in-time y limitados en el tiempo; el acceso se revisa automáticamente."}}}, {"id": "D6-Q5", "text": {"en": "Are models, MCP servers, IDE extensions and agent tools vetted before use, with provenance and SBOMs for what you build and ship?", "pt-br": "Modelos, MCP servers, extensões de IDE e ferramentas de agentes são avaliados antes do uso, com proveniência e SBOMs para o que você constrói e entrega?", "es": "¿Modelos, MCP servers, extensiones de IDE y herramientas de agentes se evalúan antes del uso, con procedencia y SBOMs para lo que construyen y entregan?"}, "anchors": {"l3": {"en": "A review process covers AI components; SBOMs and build provenance are produced for most builds.", "pt-br": "Um processo de review cobre componentes de IA; SBOMs e proveniência de build são produzidos para a maioria dos builds.", "es": "Un proceso de review cubre componentes de IA; SBOMs y procedencia de build se producen para la mayoría de los builds."}, "l4": {"en": "Provenance is verified at deployment (for example SLSA level targets); unvetted components are blocked automatically.", "pt-br": "Proveniência é verificada no deploy (por exemplo metas de nível SLSA); componentes não avaliados são bloqueados automaticamente.", "es": "La procedencia se verifica en el deploy (por ejemplo metas de nivel SLSA); los componentes no evaluados se bloquean automáticamente."}}}, {"id": "D6-Q6", "text": {"en": "Are AI features and agentic workflows threat-modeled with AI-specific risks (OWASP LLM and Agentic Top 10, NIST SP 800-218A)?", "pt-br": "Features de IA e workflows agentic são threat-modeled com riscos específicos de IA (OWASP LLM and Agentic Top 10, NIST SP 800-218A)?", "es": "¿Las features de IA y workflows agentic se someten a threat modeling con riesgos específicos de IA (OWASP LLM and Agentic Top 10, NIST SP 800-218A)?"}, "anchors": {"l3": {"en": "Threat models are required for new AI features and agent workflows and reviewed by security.", "pt-br": "Threat models são exigidos para novas features de IA e workflows de agentes, e revisados por segurança.", "es": "Se requieren threat models para nuevas features de IA y workflows de agentes, y seguridad los revisa."}, "l4": {"en": "Threat models are updated after incidents and red-team exercises; controls are verified by automated tests.", "pt-br": "Threat models são atualizados após incidentes e exercícios de red team; controles são verificados por testes automatizados.", "es": "Los threat models se actualizan después de incidentes y ejercicios de red team; los controles se verifican mediante pruebas automatizadas."}}}, {"id": "D6-Q7", "text": {"en": "Are agent sessions and actions (prompts, tool calls, commits, approvals) logged, attributable to an identity, and retained according to policy?", "pt-br": "Sessões e ações de agentes (prompts, tool calls, commits, aprovações) são registradas, atribuíveis a uma identidade e retidas de acordo com a política?", "es": "¿Las sesiones y acciones de agentes (prompts, tool calls, commits, aprobaciones) se registran, son atribuibles a una identidad y se retienen según la política?"}, "anchors": {"l3": {"en": "Agent activity is logged centrally and linked to the requesting user and the agent identity.", "pt-br": "Atividade de agentes é registrada centralmente e vinculada ao usuário solicitante e à identidade do agente.", "es": "La actividad de agentes se registra centralmente y se vincula con el usuario solicitante y la identidad del agente."}, "l4": {"en": "Logs feed anomaly detection; audits can reconstruct any agent change end to end.", "pt-br": "Logs alimentam detecção de anomalias; auditorias conseguem reconstruir qualquer mudança de agente de ponta a ponta.", "es": "Los logs alimentan detección de anomalías; las auditorías pueden reconstruir cualquier cambio de agente de punta a punta."}}}]}, {"id": "D7", "name": {"en": "Deliver and Operate", "pt-br": "Entregar e operar", "es": "Entregar y operar"}, "why_it_matters": {"en": "more AI-generated change needs strong delivery safety nets [3], [5]; Microsoft recommends continuous observation of agent activity [19] and is extending agents to cloud operations [22].", "pt-br": "mais mudanças geradas por IA precisam de redes de segurança fortes na entrega [3], [5]; a Microsoft recomenda observação contínua da atividade de agentes [19] e está estendendo agentes para operações de cloud [22].", "es": "más cambios generados por IA necesitan redes de seguridad sólidas en la entrega [3], [5]; Microsoft recomienda observación continua de la actividad de agentes [19] y está extendiendo agentes a operaciones de cloud [22]."}, "questions": [{"id": "D7-Q1", "text": {"en": "Is AI used to author, maintain and troubleshoot CI/CD pipelines (for example explaining failed runs, proposing fixes), on top of pipeline-as-code?", "pt-br": "IA é usada para criar, manter e solucionar problemas em pipelines CI/CD (por exemplo explicar runs com falha, propor correções), sobre pipeline-as-code?", "es": "¿Se usa IA para crear, mantener y solucionar problemas en pipelines CI/CD (por ejemplo explicar runs fallidos, proponer correcciones), sobre pipeline-as-code?"}, "anchors": {"l3": {"en": "Pipelines are code in most repositories; AI-assisted failure analysis is available to all teams.", "pt-br": "Pipelines são code na maioria dos repositórios; análise de falhas assistida por IA está disponível para todas as equipes.", "es": "Los pipelines son code en la mayoría de los repositorios; el análisis de fallas asistido por IA está disponible para todos los equipos."}, "l4": {"en": "Agents propose pipeline fixes and optimizations automatically, under review, with build time and failure rate tracked.", "pt-br": "Agentes propõem correções e otimizações de pipeline automaticamente, sob review, com tempo de build e taxa de falhas rastreados.", "es": "Los agentes proponen correcciones y optimizaciones de pipeline automáticamente, bajo review, con tiempo de build y tasa de fallas rastreados."}}}, {"id": "D7-Q2", "text": {"en": "Can teams release AI-assisted changes safely through progressive delivery (feature flags, canary or blue/green) and automated rollback?", "pt-br": "As equipes conseguem lançar mudanças assistidas por IA com segurança por meio de entrega progressiva (feature flags, canary ou blue/green) e rollback automatizado?", "es": "¿Los equipos pueden lanzar cambios asistidos por IA de forma segura mediante entrega progresiva (feature flags, canary o blue/green) y rollback automatizado?"}, "anchors": {"l3": {"en": "Most services use feature flags or staged rollout; rollback is automated for critical services.", "pt-br": "A maioria dos serviços usa feature flags ou rollout em estágios; rollback é automatizado para serviços críticos.", "es": "La mayoría de los servicios usa feature flags o rollout por etapas; rollback está automatizado para servicios críticos."}, "l4": {"en": "Rollout decisions are driven by health signals automatically; change failure rate and recovery time are tracked per service.", "pt-br": "Decisões de rollout são conduzidas automaticamente por sinais de saúde; change failure rate e tempo de recuperação são rastreados por serviço.", "es": "Las decisiones de rollout se guían automáticamente por señales de salud; change failure rate y tiempo de recuperación se rastrean por servicio."}}}, {"id": "D7-Q3", "text": {"en": "Is AI used in incident response (alert correlation, summarization, root-cause hypotheses, post-incident review drafts) with humans in command?", "pt-br": "IA é usada em resposta a incidentes (correlação de alertas, sumarização, hipóteses de causa raiz, rascunhos de revisão pós-incidente) com humanos no comando?", "es": "¿Se usa IA en respuesta a incidentes (correlación de alertas, resumen, hipótesis de causa raíz, borradores de revisión post-incidente) con humanos al mando?"}, "anchors": {"l3": {"en": "On-call engineers in most teams use AI for triage and summaries; post-incident reviews record whether AI helped.", "pt-br": "Engenheiros de on-call na maioria das equipes usam IA para triage e resumos; revisões pós-incidente registram se a IA ajudou.", "es": "Los ingenieros de on-call en la mayoría de los equipos usan IA para triage y resúmenes; las revisiones post-incidente registran si la IA ayudó."}, "l4": {"en": "Operations agents run approved diagnostics automatically; time to restore is compared before and after adoption.", "pt-br": "Agentes de operações executam diagnósticos aprovados automaticamente; tempo de restauração é comparado antes e depois da adoção.", "es": "Los agentes de operaciones ejecutan diagnósticos aprobados automáticamente; el tiempo de restauración se compara antes y después de la adopción."}}}, {"id": "D7-Q4", "text": {"en": "Are AI agents in the SDLC observable (traces of runs and tool calls, latency, failures, cost), for example through OpenTelemetry?", "pt-br": "Agentes de IA no SDLC são observáveis (traces de runs e tool calls, latência, falhas, custo), por exemplo por meio de OpenTelemetry?", "es": "¿Los agentes de IA en el SDLC son observables (traces de runs y tool calls, latencia, fallas, costo), por ejemplo mediante OpenTelemetry?"}, "anchors": {"l3": {"en": "Agent runs emit telemetry to the central observability stack; dashboards show failures and cost per agent.", "pt-br": "Runs de agentes emitem telemetria para a stack central de observabilidade; dashboards mostram falhas e custo por agente.", "es": "Los runs de agentes emiten telemetría al stack central de observabilidad; los dashboards muestran fallas y costo por agente."}, "l4": {"en": "Alerts fire on agent drift, error spikes or cost anomalies; findings feed governance (D1).", "pt-br": "Alertas disparam em drift de agentes, picos de erro ou anomalias de custo; achados alimentam governança (D1).", "es": "Las alertas se disparan por drift de agentes, picos de error o anomalías de costo; los hallazgos alimentan gobernanza (D1)."}}}, {"id": "D7-Q5", "text": {"en": "Is AI used to write and review infrastructure as code, with policy-as-code guardrails that block non-compliant changes?", "pt-br": "IA é usada para escrever e revisar infrastructure as code, com guardrails de policy-as-code que bloqueiam mudanças não conformes?", "es": "¿Se usa IA para escribir y revisar infrastructure as code, con guardrails de policy-as-code que bloquean cambios no conformes?"}, "anchors": {"l3": {"en": "Most infrastructure is code; AI-generated IaC passes the same policy checks and plan reviews.", "pt-br": "A maior parte da infraestrutura é code; IaC gerado por IA passa pelos mesmos policy checks e plan reviews.", "es": "La mayor parte de la infraestructura es code; IaC generado por IA pasa los mismos policy checks y plan reviews."}, "l4": {"en": "Drift is detected and corrected through GitOps; policy violations by AI-generated IaC are tracked and trending down.", "pt-br": "Drift é detectado e corrigido por meio de GitOps; violações de política por IaC gerado por IA são rastreadas e estão em queda.", "es": "Drift se detecta y corrige mediante GitOps; las violaciones de política por IaC generado por IA se rastrean y van a la baja."}}}, {"id": "D7-Q6", "text": {"en": "Are operational tasks (runbooks, remediation, dependency and patch updates) automated by agents under defined approval rules?", "pt-br": "Tarefas operacionais (runbooks, remediação, atualizações de dependências e patches) são automatizadas por agentes sob regras de aprovação definidas?", "es": "¿Las tareas operacionales (runbooks, remediación, actualizaciones de dependencias y patches) están automatizadas por agentes bajo reglas de aprobación definidas?"}, "anchors": {"l3": {"en": "Common runbooks and dependency updates are automated; approvals follow the autonomy matrix (D1-Q5).", "pt-br": "Runbooks comuns e atualizações de dependências são automatizados; aprovações seguem a matriz de autonomia (D1-Q5).", "es": "Los runbooks comunes y las actualizaciones de dependencias están automatizados; las aprobaciones siguen la matriz de autonomía (D1-Q5)."}, "l4": {"en": "Most routine operations run automatically with audited approvals; human effort shifts to exceptions.", "pt-br": "A maioria das operações rotineiras executa automaticamente com aprovações auditadas; o esforço humano se desloca para exceções.", "es": "La mayoría de las operaciones rutinarias se ejecuta automáticamente con aprobaciones auditadas; el esfuerzo humano se desplaza a excepciones."}}}]}, {"id": "D8", "name": {"en": "Engineering Foundations (AI amplifiers)", "pt-br": "Fundamentos de engenharia (amplificadores de IA)", "es": "Fundamentos de ingeniería (amplificadores de IA)"}, "why_it_matters": {"en": "DORA finds that these capabilities amplify the benefits of AI adoption, and that a high-quality internal platform correlates with the ability to unlock AI value [1], [3].", "pt-br": "DORA constata que essas capacidades amplificam os benefícios da adoção de IA, e que uma plataforma interna de alta qualidade se correlaciona com a capacidade de desbloquear valor de IA [1], [3].", "es": "DORA encuentra que estas capacidades amplifican los beneficios de la adopción de IA, y que una plataforma interna de alta calidad se correlaciona con la capacidad de desbloquear valor de IA [1], [3]."}, "questions": [{"id": "D8-Q1", "text": {"en": "Are application code, configuration, build automation, system configuration and AI prompts/instructions all stored in version control?", "pt-br": "Application code, configuração, automação de build, configuração de sistema e prompts/instruções de IA estão todos armazenados em controle de versão?", "es": "¿Application code, configuración, automatización de build, configuración de sistema y prompts/instrucciones de IA están todos almacenados en control de versiones?"}, "anchors": {"l3": {"en": "All five asset types are versioned for most services.", "pt-br": "Todos os cinco tipos de ativos são versionados para a maioria dos serviços.", "es": "Los cinco tipos de activos están versionados para la mayoría de los servicios."}, "l4": {"en": "Nothing reaches production without a versioned source; checks confirm this automatically.", "pt-br": "Nada chega à produção sem uma fonte versionada; checks confirmam isso automaticamente.", "es": "Nada llega a producción sin una fuente versionada; los checks lo confirman automáticamente."}}}, {"id": "D8-Q2", "text": {"en": "Do engineers commit small changes frequently and rely on fast undo/revert when experimenting with AI output?", "pt-br": "Os engenheiros fazem commit de mudanças pequenas com frequência e contam com undo/revert rápido ao experimentar com saída de IA?", "es": "¿Los ingenieros hacen commit de cambios pequeños con frecuencia y confían en undo/revert rápido al experimentar con salida de IA?"}, "anchors": {"l3": {"en": "Most engineers commit at least daily; reverting a change is routine and fast.", "pt-br": "A maioria dos engenheiros faz commit pelo menos diariamente; reverter uma mudança é rotina e rápido.", "es": "La mayoría de los ingenieros hace commit al menos diariamente; revertir un cambio es rutinario y rápido."}, "l4": {"en": "Trunk-based development with short-lived branches is the norm; revert time is measured.", "pt-br": "Trunk-based development com branches de curta duração é a norma; tempo de revert é medido.", "es": "Trunk-based development con branches de corta duración es la norma; se mide el tiempo de revert."}}}, {"id": "D8-Q3", "text": {"en": "Is there an internal developer platform that is easy to use, abstracts infrastructure, and makes the secure and compliant path the default for humans and agents?", "pt-br": "Existe uma internal developer platform fácil de usar, que abstrai infraestrutura e torna o caminho seguro e conforme o padrão para humanos e agentes?", "es": "¿Existe una internal developer platform fácil de usar, que abstrae infraestructura y hace que la ruta segura y conforme sea la predeterminada para humanos y agentes?"}, "anchors": {"l3": {"en": "A dedicated platform team offers self-service golden paths used by most teams; the team acts on feedback.", "pt-br": "Uma equipe dedicada de plataforma oferece golden paths de self-service usados pela maioria das equipes; a equipe age com base em feedback.", "es": "Un equipo dedicado de plataforma ofrece golden paths de self-service usados por la mayoría de los equipos; el equipo actúa sobre el feedback."}, "l4": {"en": "Agents use the same platform APIs and guardrails as humans; platform satisfaction is measured and improving.", "pt-br": "Agentes usam as mesmas APIs e guardrails da plataforma que humanos; satisfação com a plataforma é medida e melhora.", "es": "Los agentes usan las mismas APIs y guardrails de plataforma que los humanos; la satisfacción con la plataforma se mide y mejora."}}}, {"id": "D8-Q4", "text": {"en": "Can engineers and AI tools find and use reliable internal data (not siloed, good quality, answerable quickly)?", "pt-br": "Engenheiros e ferramentas de IA conseguem encontrar e usar dados internos confiáveis (não em silos, de boa qualidade, respondíveis rapidamente)?", "es": "¿Los ingenieros y herramientas de IA pueden encontrar y usar datos internos confiables (no aislados en silos, de buena calidad, respondibles rápidamente)?"}, "anchors": {"l3": {"en": "Key data is cataloged with owners and quality indicators; most questions can be answered within an hour.", "pt-br": "Dados-chave são catalogados com responsáveis e indicadores de qualidade; a maioria das perguntas pode ser respondida em até uma hora.", "es": "Los datos clave están catalogados con responsables e indicadores de calidad; la mayoría de las preguntas puede responderse en una hora."}, "l4": {"en": "Data quality is monitored automatically; lineage and contracts are in place for critical data.", "pt-br": "Qualidade de dados é monitorada automaticamente; linhagem e contratos existem para dados críticos.", "es": "La calidad de datos se monitorea automáticamente; existen linaje y contratos para datos críticos."}}}, {"id": "D8-Q5", "text": {"en": "Are development environments reproducible (devcontainers, cloud workspaces, pinned toolchains) so that humans and agents build and test the same way?", "pt-br": "Ambientes de desenvolvimento são reproduzíveis (devcontainers, cloud workspaces, toolchains fixadas) para que humanos e agentes façam build e test da mesma forma?", "es": "¿Los entornos de desarrollo son reproducibles (devcontainers, cloud workspaces, toolchains fijadas) para que humanos y agentes hagan build y test de la misma forma?"}, "anchors": {"l3": {"en": "Most repositories define a reproducible environment; agents use the same definition.", "pt-br": "A maioria dos repositórios define um ambiente reproduzível; agentes usam a mesma definição.", "es": "La mayoría de los repositorios define un entorno reproducible; los agentes usan la misma definición."}, "l4": {"en": "Environments start in minutes for any repository; drift from the definition is detected.", "pt-br": "Ambientes iniciam em minutos para qualquer repositório; drift em relação à definição é detectado.", "es": "Los entornos inician en minutos para cualquier repositorio; se detecta drift respecto de la definición."}}}, {"id": "D8-Q6", "text": {"en": "Is documentation kept as code, current and owned, so it can serve as reliable context for AI tools?", "pt-br": "A documentação é mantida como code, atual e com ownership, para que sirva como contexto confiável para ferramentas de IA?", "es": "¿La documentación se mantiene como code, actualizada y con ownership, para que pueda servir como contexto confiable para herramientas de IA?"}, "anchors": {"l3": {"en": "Docs live next to code with owners; stale docs are flagged in reviews.", "pt-br": "Docs ficam junto ao code com responsáveis; docs desatualizadas são sinalizadas em reviews.", "es": "Los docs viven junto al code con responsables; los docs obsoletos se señalan en reviews."}, "l4": {"en": "Freshness is checked automatically; AI-generated doc changes are reviewed like code.", "pt-br": "Atualização é verificada automaticamente; mudanças de docs geradas por IA são revisadas como code.", "es": "La actualidad se verifica automáticamente; los cambios de docs generados por IA se revisan como code."}}}, {"id": "D8-Q7", "text": {"en": "Is automated testing deep and fast enough to catch regressions from high volumes of AI-generated change (unit, integration, end-to-end, contract)?", "pt-br": "Testes automatizados são profundos e rápidos o suficiente para capturar regressões de altos volumes de mudanças geradas por IA (unit, integration, end-to-end, contract)?", "es": "¿Las pruebas automatizadas son suficientemente profundas y rápidas para detectar regresiones de altos volúmenes de cambios generados por IA (unit, integration, end-to-end, contract)?"}, "anchors": {"l3": {"en": "Most services have layered automated tests that run on every PR within agreed time budgets.", "pt-br": "A maioria dos serviços tem testes automatizados em camadas que executam em todo PR dentro de time budgets acordados.", "es": "La mayoría de los servicios tiene pruebas automatizadas por capas que se ejecutan en cada PR dentro de time budgets acordados."}, "l4": {"en": "Test suites are tuned from escaped-defect data; feedback time is tracked and improving.", "pt-br": "Suites de teste são ajustadas a partir de dados de defeitos escapados; tempo de feedback é rastreado e melhora.", "es": "Las suites de prueba se ajustan a partir de datos de defectos escapados; el tiempo de feedback se rastrea y mejora."}}}]}, {"id": "D9", "name": {"en": "Measurement, Value and AI FinOps", "pt-br": "Medição, valor e AI FinOps", "es": "Medición, valor y AI FinOps"}, "why_it_matters": {"en": "controlled studies range from 55.8% faster [33] and 26.08% more completed tasks [34] to 19% slower with a strong perception gap [35], so organizations need their own objective measurement; Gartner predicts AI coding costs will overtake the average developer's salary by 2028 [32].", "pt-br": "estudos controlados variam de 55.8% mais rápido [33] e 26.08% mais tarefas concluídas [34] a 19% mais lento com uma forte lacuna de percepção [35], portanto as organizações precisam de sua própria medição objetiva; o Gartner prevê que os custos de AI coding ultrapassarão o salário médio de um desenvolvedor até 2028 [32].", "es": "estudios controlados van desde 55.8% más rápido [33] y 26.08% más tareas completadas [34] hasta 19% más lento con una fuerte brecha de percepción [35], por lo que las organizaciones necesitan su propia medición objetiva; Gartner predice que los costos de AI coding superarán el salario promedio de un desarrollador para 2028 [32]."}, "questions": [{"id": "D9-Q1", "text": {"en": "Is AI adoption tracked with telemetry beyond seat counts (active users, engagement by feature, adoption cohorts)?", "pt-br": "A adoção de IA é rastreada com telemetria além da contagem de seats (usuários ativos, engajamento por feature, coortes de adoção)?", "es": "¿La adopción de IA se rastrea con telemetría más allá del conteo de seats (usuarios activos, engagement por feature, cohortes de adopción)?"}, "anchors": {"l3": {"en": "Usage metrics (for example the Copilot usa
